<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Excursion - Discover hidden places in the world around you. Your personal travel guide for iPhone and Android.">
  <title>Excursion</title>
  <link rel="stylesheet" href="resources/css/style.css">
</head>
<body>
  <!-- Header / Hero Section -->
  <header>
    <h1 class="hero-title">Discover hidden places in the world around you</h1>
    <p><a class="link-app" href="#">Download Excursion (Coming soon!)</a></p>
    <div class="video-container">
      <video autoplay loop muted playsinline>
        <source src="resources/videos/excursion.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </div>
  </header>

  <!-- Main Feature Section -->
  <main>
    <section class="feature-guide">
      <h2 class="section-title">Your personal travel guide</h2>
      <p class="feature-description">
        Excursion remembers places you like, and recommends new points of interest around you.
      </p>
      <div class="image-container">
        <img class="img-landscape" src="resources/images/camp.webp" alt="Illuminated tents at camping site at night">
      </div>
    </section>

    <!-- Coming Soon Section -->
    <section class="feature-coming-soon">
      <p class="icon-wrapper">
        <img class="icon-phone" src="resources/images/phone.webp" alt="Phone icon">
      </p>
      <h2 class="section-title">Coming Soon for iPhone and Android</h2>
      <p><a class="link-app" href="#">Download Excursion (Coming soon!)</a></p>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <p class="copyright">&copy; Excursion</p>
  </footer>
</body>
</html>
